# Every push and pull request: format, lint, tests and the project rules on
# three platforms, and the supply-chain checks once per run.
name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # snet-rules reads every commit message and refuses a shallow
          # clone.
          fetch-depth: 0
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --no-fail-fast
      - name: Project rules
        run: cargo run -p snet-rules -- ..

  supply-chain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit@0.22.2
      - name: Licences, bans and sources of the workspace
        run: cargo deny check
      - name: Advisories of the workspace
        run: cargo audit
