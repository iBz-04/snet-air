[package]
name = "snet-wire"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The HTTP and JSON pieces the cloud and local clients share: an IO adapter with a reply-head limit, strict JSON, and the reply-schema subset"

[dependencies]
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net"] }

[lints]
workspace = true
