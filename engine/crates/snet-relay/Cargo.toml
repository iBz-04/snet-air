[package]
name = "snet-relay"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The relay protocol: the local model screens and condenses a question without files, the cloud model answers it"

[dependencies]
serde_json = "1.0.154"
sha2 = "0.11.1"
snet-cloud = { path = "../snet-cloud" }
snet-local = { path = "../snet-local" }
snet-protocol = { path = "../snet-protocol" }
snet-pseudonym = { path = "../snet-pseudonym" }
snet-transcript = { path = "../snet-transcript" }
tokio = { version = "1.54.1", features = ["rt", "time"] }

[dev-dependencies]
snet-local = { path = "../snet-local" }
snet-protocol = { path = "../snet-protocol" }
snet-testkit = { path = "../snet-testkit" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
