[package]
name = "snet-transcript"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "A plain JSON-lines transcript per task: every request exactly as sent to the cloud, every reply and the task's local steps"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
snet-cloud = { path = "../snet-cloud" }
thiserror = "2.0.21"

[dev-dependencies]
bytes = "1.12.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[lints]
workspace = true
