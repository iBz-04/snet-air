[package]
name = "snet-pseudonym"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Replaces personal data with per-task pseudonyms locally before any text leaves, and restores it in the cloud's answers"

[dependencies]
aho-corasick = "1.1.5"
iban_validate = { version = "5.0.1", default-features = false }
regex = "1.13.1"
regex-syntax = "0.8.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
snet-wire = { path = "../snet-wire" }
thiserror = "2.0.21"
toml = "1.2.0"
unicode-normalization = "0.1.26"
zeroize = "1.9.1"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

[lints]
workspace = true
